name: CI — API

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'turbo.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [develop]
    paths:
      - 'apps/api/**'
      - 'packages/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline

      - name: Lint
        run: npx turbo run lint --filter=@dreamcloud/api

      - name: Type Check
        run: npx turbo run type-check --filter=@dreamcloud/api

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dreamcloud_test
          POSTGRES_USER: dreamcloud
          POSTGRES_PASSWORD: dreamcloud_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dreamcloud:dreamcloud_test_pass@localhost:5432/dreamcloud_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_PRIVATE_KEY: ${{ secrets.JWT_TEST_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_TEST_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline

      - name: Run Migrations
        working-directory: apps/api
        run: npm run migration:run

      - name: Run Tests
        run: npx turbo run test:ci --filter=@dreamcloud/api

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage/lcov.info
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}
