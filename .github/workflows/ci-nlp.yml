name: CI — NLP

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/nlp/**'
      - '.github/workflows/ci-nlp.yml'
  push:
    branches: [develop]
    paths:
      - 'apps/nlp/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Ruff, mypy & pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dreamcloud_test
          POSTGRES_USER: dreamcloud
          POSTGRES_PASSWORD: dreamcloud_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dreamcloud:dreamcloud_test_pass@localhost:5432/dreamcloud_test
      PYTHONPATH: apps/nlp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/nlp/requirements-dev.txt

      - name: Install Dependencies
        working-directory: apps/nlp
        run: pip install -r requirements-dev.txt

      - name: Ruff Lint
        working-directory: apps/nlp
        run: ruff check .

      - name: Ruff Format Check
        working-directory: apps/nlp
        run: ruff format --check .

      - name: mypy Type Check
        working-directory: apps/nlp
        run: mypy app

      - name: pytest
        working-directory: apps/nlp
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/nlp/coverage.xml
          flags: nlp
          token: ${{ secrets.CODECOV_TOKEN }}
