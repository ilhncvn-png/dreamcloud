name: dreamcloud-test

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: dreamcloud-postgres-test
    environment:
      POSTGRES_DB: dreamcloud_test
      POSTGRES_USER: dreamcloud
      POSTGRES_PASSWORD: dreamcloud_test_pass
    ports:
      - "5433:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamcloud -d dreamcloud_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    container_name: dreamcloud-redis-test
    ports:
      - "6380:6379"
    tmpfs:
      - /data

networks:
  default:
    name: dreamcloud-test
